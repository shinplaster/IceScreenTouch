# IceScreen Touch API: OpenAPI 3.1 specification (hand-written).
#
# This file is the source of truth. The application serves GET /v1/openapi.json from
# src/IceScreenTouch.Api/openapi.json, which is GENERATED from this file. After every edit, regenerate it:
#
#   uv run --with pyyaml python tools/openapi_to_json.py
#
# The tests (tests/IceScreenTouch.Api.Tests/OpenApiSpecTests.cs) fail when the JSON is stale or when the paths and
# methods here differ from the routes the server registers.
#
# YAML pitfalls: quote status codes ("200") and version strings; the generator refuses non-string mapping keys.

openapi: "3.1.0"

info:
  title: IceScreen Touch API
  version: "1.0.0"
  summary: Control an iPhone or iPad from scripts through IceScreen Touch on the same Windows PC.
  description: |
    IceScreen Touch mirrors an iPhone or iPad to a Windows PC and sends mouse input to the device as Bluetooth LE
    HID touches. This automation API lets a script or an AI agent do the same with programmatic input: touch gestures
    (tap, long press, swipe, path, pinch), keys and text, the home button, reading and tapping the text on the
    screen (OCR), and low-level multi-touch over a WebSocket. The version of this document is the version of the API (`apiVersion` in `GET /v1/status` is its
    major number, `1`).

    ## Availability

    * The API is **off by default**. The user switches it on in the app (Settings, "Automation API"). It listens on
      `127.0.0.1` only (never on `::1` or another address) on port 47821 by default; the user can choose another
      port (1024 to 65535, not the probe page's port 8000). A port that is in use is an error in the app, the app
      never looks for another one.
    * The API is part of the purchased app (and of a build made from the source), without a limit. In the 7-day trial of
      the Microsoft Store app it works with the **trial quota** (below). After the trial ends, or while the Microsoft
      Store license cannot be checked, it is not started; if the license stops covering it while the API runs, every
      call answers `403` `purchase_required`, except `POST /v1/cancel` (a stop command always works).

    ## Trial quota

    In the trial the API counts over the **whole trial** (the counts never reset, and restarting the app does not reset
    them):

    * **300 operations**: `POST /v1/touch/tap`, `long-press`, `swipe`, `path`, `pinch`, `POST /v1/keys/press`,
      `POST /v1/keys/type`, `POST /v1/home`, `POST /v1/touch/tap-text`, and each WebSocket stream (one connection
      is one operation).
    * **300 captures**: `GET /v1/screenshot`, `POST /v1/text/read`, `POST /v1/text/find` (one request counts once,
      however often it reads the screen while it waits).
    * A WebSocket stream stays open at most **5 minutes**; then everything is lifted and released and the stream is
      closed (1008, an `error` event `purchase_required` with `reason: "trial_limit"` and `counter: "stream_seconds"`).
    * Not counted: `GET /v1/status`, `GET` and `PUT /v1/rotation`, `PUT /v1/target`, `POST /v1/cancel`, `GET
      /v1/openapi.json`, and every request that was refused before it did its work (`400`, `busy`, `user_active`,
      `not_running`, `not_connected`, `no_picture`, `rate_limited`, `ocr_unavailable`, ...). An operation counts when it
      starts on the device (also when the user then interrupts it), a capture when the screen was captured or read,
      `tap-text` when its search starts (whether or not it then taps).
    * `GET /v1/status` has `trial` with what is left (only in the trial).
    * When a counter is used up, the requests it counts answer `403` `purchase_required` with `reason: "trial_limit"`,
      `limit` and `counter` (`operations` or `captures`); a malformed request is still `400` first. The other counter
      and the free endpoints keep working. Buying the app lifts the quota at once.
    * The API can only drive the one target device the app currently sends input to (see `PUT /v1/target`).

    ## Finding the API (connection discovery)

    When the API is on, the app writes `api.json` (only the current Windows user can read it) and deletes it when
    the API is switched off:

    ```json
    { "port": 47821, "token": "<43 characters>", "pid": 1234 }
    ```

    * Normal install: `%LOCALAPPDATA%\IceScreenTouch\api.json`.
    * Store (MSIX) install: the same file is redirected to
      `%LOCALAPPDATA%\Packages\Shin-plaster.IceScreenTouch_5c159ja95e6hm\LocalCache\Local\IceScreenTouch\api.json`
      when `%LOCALAPPDATA%\IceScreenTouch` did not exist yet; if that folder already existed (for example from a
      build of your own), the Store install uses it like a normal install.
    * `pid` is the process that owns the port, so a client can check that it talks to IceScreen Touch (and that
      the process runs as the same Windows user, see the owner check in the API guide) before it sends the token.
    * Clients are expected to look first at the environment variables `ICESCREENTOUCH_API` (for example
      `http://127.0.0.1:47821`) and `ICESCREENTOUCH_TOKEN`, then at `api.json`.

    ## Authentication and browser protection

    * Every call except `GET /v1/openapi.json` and the WebSocket upgrade of `GET /v1/stream` carries
      `Authorization: Bearer <token>`. The token is 256 random bits as 43 Base64url characters; the user can copy
      or regenerate it in the app. Regenerating it makes the old one stop working at once (an open WebSocket is
      closed with 1008).
    * A browser cannot set `Authorization` on a WebSocket, so the WebSocket takes the token in its first message
      (see `GET /v1/stream`).
    * Any request with an `Origin` header is refused with `403` `forbidden_origin` (there is no CORS: scripts and
      command-line tools do not send `Origin`, web pages always do).
    * The `Host` header must be `127.0.0.1:<port>` with the port of the API (protection against DNS rebinding;
      use the address `127.0.0.1`, not the name `localhost`), else `403` `forbidden_origin`.
    * The checks run in this order: `Origin`, `Host`, token (`401` `unauthorized`, with
      `WWW-Authenticate: Bearer`), route (`404` `not_found`, `405` `method_not_allowed` with an `Allow` header), then
      the request body.

    ## Requests and responses

    * Success is `200` with a JSON body. Operations that return nothing answer `{}`. The one exception is
      `GET /v1/screenshot`, which answers an image (PNG or JPEG) with the details in `X-IceScreenTouch-*` headers.
    * Errors are `application/problem+json` (RFC 9457) with the machine-readable extension member `code` (see
      the `Problem` schema). `type` is always `about:blank`; `detail` is a sentence for a person and never contains
      your data.
    * A body is JSON in UTF-8 with `Content-Type: application/json` and at most **64 KB**. A body that is not valid for
      the endpoint is `400` `invalid_request`: unknown members are refused, missing required members are refused,
      numbers must be JSON numbers (not strings), and a body is required where the endpoint takes one.
    * Every response has `Cache-Control: no-store` and `X-Content-Type-Options: nosniff`.
    * An operation answers only **after** it has finished on the device (a swipe answers after the finger lifted).

    ## Operations: one at a time, limited in time

    * Only **one operation at a time**. A touch, key, home, `PUT /v1/rotation`, `PUT /v1/target` or a WebSocket
      session that is running makes every other operation answer `409` `busy`; the API never queues. `GET
      /v1/status`, `GET /v1/rotation`, `GET /v1/screenshot`, `POST /v1/text/read`, `POST /v1/text/find` and `GET
      /v1/openapi.json` are not operations and always work. `POST /v1/touch/tap-text` is an operation. While the
      probe (measurement) page of the app is running, operations are `409` `busy` too.
    * No operation takes longer than **60 seconds** (the sum of holds, durations, intervals and the last `t` of a
      path), else `400` `invalid_request`.
    * A touch is held at least **70 ms** (a shorter `holdMs` of a tap or long press is raised to 70); frames of a
      moving finger go out every 16 ms. A finger is always lifted at its last position.
    * `POST /v1/cancel` stops the running operation (the fingers and keys are lifted; the stopped request answers
      `499` `cancelled`).

    ## The user has priority

    The person at the PC can always take over the mirror window. When they use it (mouse press on the picture,
    wheel, the keys that go to the device, Home, rotate), a running operation is stopped, every finger is lifted
    and every key is released: a REST call answers `409` `user_interrupted`, a WebSocket stream gets an
    `interrupted` event with reason `user` and is closed. For one second after the user's last input (and while they
    hold the mouse or a key), a new operation is refused with `409` `user_active`. The API never resumes by itself:
    the client decides whether to try again.

    ## Coordinate spaces

    Every position has a space, `space` (default `screen`):

    | space | meaning | needs the picture |
    |---|---|---|
    | `screen` | The screen **as it is seen now**, normalized to 0..1 (0,0 top left, 1,1 bottom right). Landscape means a wide screen. The app undoes the rotation. | yes |
    | `pixel` | Pixels of a screenshot. `ref: { "width": W, "height": H }`, the size of that screenshot, is **required**. x is 0..W, y is 0..H. | yes |
    | `device` | The digitizer's own portrait frame, 0..1, never rotated. | no |

    * A position outside the range (below 0, above 1 or above the `ref` size, or not a number) is `400`
      `invalid_request`.
    * `screen` and `pixel` need the picture of the device (to know whether it is portrait or landscape). Without
      it (the receiver window is closed or minimized) the call is `409` `no_picture`.
    * A `pixel` request whose `ref` has the opposite orientation (wide versus tall) from the current picture means
      the device rotated since the screenshot: `409` `picture_changed`. Take a new screenshot. A square `ref` is
      never refused.
    * The **left or right side of a landscape screen cannot be detected** by the app. The assumed rotation is in
      `GET /v1/status` (`rotation`); if it is wrong, correct it with `PUT /v1/rotation` (saved, like `Ctrl+R`
      in the app). The same holds for an upside-down portrait screen (180).

    ## Notes on the device

    * Touch input only arrives if **Zoom** (Accessibility) is on in the device.
    * Typing sends keys of a **US keyboard**. Characters without a key (Japanese, emoji) cannot be typed directly;
      they are skipped and reported.
    * The API cannot know whether the device is locked and does not stop input to a passcode screen.

    ## Text on the screen (OCR)

    `POST /v1/text/read`, `POST /v1/text/find` and `POST /v1/touch/tap-text` read the text of the picture with an OCR
    engine. The engine is Windows.Media.Ocr, part of Windows; it recognizes on this PC. The text is never written to a
    file or kept after the request.

    * **Languages**: the OCR languages Windows has installed (`GET /v1/status`, `ocr.languages`). Without `lang` the first
      of the Windows user's languages that has OCR is used. A language that is not installed is `409`
      `ocr_unavailable` with the installed ones in `available`; the app never switches to another language by itself.
      A screen in Japanese needs `ja` (`en-US` cannot read Japanese; `ja` also reads Latin letters). **When nothing is
      found, check that the language matches the screen.**
    * **Boxes** are in `screen` space (0..1, default) or `pixel` space (of `ref`); `device` is not accepted. A box can go
      straight to `POST /v1/touch/tap` with the same space.
    * **Matching** (`find`, `tap-text`): both sides are normalized (NFKC, white space removed, case folded unless
      `caseSensitive`). `match: exact` (default) compares whole lines and may leave out a single isolated non-kanji
      character at either end of a line (an icon read as a letter, such as `Q` for a magnifier); `contains` matches
      part of a line. `loose` also treats look-alike characters, voiced marks and the kinds of kana as the same (for
      misreads such as `キーポード` or `lceScreen`).
    * **Limits**: at most 5 readings a second over all clients, which also count as screenshots (10 a second in
      all); one recognition at a time, with two waiting; at most two `find` or `tap-text` calls with `timeoutMs`
      waiting at once. While waiting, the receiver window shows the capture border (as for screenshots).
  license:
    name: MIT
    identifier: MIT
  contact:
    name: IceScreen Touch
    url: https://github.com/shinplaster/IceScreenTouch

servers:
  - url: http://127.0.0.1:{port}
    description: The app on the same PC. Only 127.0.0.1 is served.
    variables:
      port:
        default: "47821"
        description: The port chosen in the app (default 47821). The connection file `api.json` has it.

security:
  - bearerAuth: []

tags:
  - name: status
    description: Read the state of the app and the device.
  - name: settings
    description: Change what the app assumes (target device, rotation).
  - name: touch
    description: Touch gestures of one or two fingers.
  - name: text
    description: Read, find and tap text on the screen (OCR, on this PC).
  - name: keys
    description: Keyboard input and the home button.
  - name: control
    description: Stop the running operation.
  - name: stream
    description: Low-level input over a WebSocket.
  - name: spec
    description: This document.

paths:
  /v1/status:
    get:
      operationId: getStatus
      tags: [status]
      summary: State of the app, the devices and the picture
      description: |
        Not an operation: it works while another operation runs (`operating` tells whether one does).
      responses:
        "200":
          description: The state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/target:
    put:
      operationId: setTarget
      tags: [settings]
      summary: Choose the device that gets the input
      description: |
        Sets the device that touches and keys go to (`null` = automatic). A device id is one of `devices[].id` of
        `GET /v1/status`; an unknown id is `400` `invalid_request`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetRequest"
            examples:
              device:
                summary: A device
                value: { "deviceId": "iphone-1" }
              automatic:
                summary: Automatic
                value: { "deviceId": null }
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            `not_running` (the mirroring session is not running) or `busy` (another operation, a stream or the probe
            page is running).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "499":
          $ref: "#/components/responses/Cancelled"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/rotation:
    get:
      operationId: getRotation
      tags: [settings]
      summary: The rotations the app assumes
      description: |
        Not an operation: it works while another operation runs.
      responses:
        "200":
          description: The assumed rotations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rotation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: setRotation
      tags: [settings]
      summary: Correct the assumed rotation
      description: |
        The app cannot tell the two landscape directions (90 or 270) or an upside-down portrait (180) from the
        picture, so it assumes one. This corrects the assumption (saved, like `Ctrl+R` in the app). At least one of
        `landscape` and `portrait` is required; the one that is left out stays. It is an operation (`busy` while
        another runs) but needs no picture and no connected device. Answers the rotations now in force.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotationRequest"
            examples:
              landscape:
                value: { "landscape": 270 }
      responses:
        "200":
          description: The rotations now in force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rotation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`busy`: another operation, a stream or the probe page is running."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "499":
          $ref: "#/components/responses/Cancelled"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/touch/tap:
    post:
      operationId: tap
      tags: [touch]
      summary: Tap (one finger, once or several times)
      description: |
        Puts one finger down at the position, holds it for `holdMs` (at least 70) and lifts it; repeated `count`
        times with `intervalMs` between a lift and the next touch (at least 25). The total
        (`count` x hold + (`count` - 1) x interval) is at most 60 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TapRequest"
            examples:
              screen:
                summary: Tap the middle of the screen
                value: { "x": 0.5, "y": 0.5 }
              pixel:
                summary: Double tap at a screenshot pixel
                value: { "x": 540, "y": 1820, "space": "pixel", "ref": { "width": 1080, "height": 2340 }, "count": 2 }
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ConflictTouch"
        "499":
          $ref: "#/components/responses/Cancelled"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/touch/long-press:
    post:
      operationId: longPress
      tags: [touch]
      summary: Long press
      description: One finger held at the position for `holdMs` (default 800, at least 70).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LongPressRequest"
            examples:
              default:
                value: { "x": 0.5, "y": 0.8, "holdMs": 1000 }
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ConflictTouch"
        "499":
          $ref: "#/components/responses/Cancelled"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/touch/swipe:
    post:
      operationId: swipe
      tags: [touch]
      summary: Swipe or drag with one finger
      description: |
        The finger goes down at `from`, waits there `holdBeforeMs` (a long press before the drag, for example to
        reorder icons), moves in a straight line to `to` in `durationMs` (a frame every 16 ms), waits there
        `holdAfterMs` (stops the scrolling momentum) and lifts at `to`. `holdBeforeMs` + `durationMs` +
        `holdAfterMs` is at most 60 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwipeRequest"
            examples:
              scrollUp:
                value: { "from": { "x": 0.5, "y": 0.8 }, "to": { "x": 0.5, "y": 0.2 }, "durationMs": 300 }
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ConflictTouch"
        "499":
          $ref: "#/components/responses/Cancelled"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/touch/path:
    post:
      operationId: path
      tags: [touch]
      summary: Drag one finger along any path
      description: |
        One finger follows `points`; each point has `t`, the milliseconds since the finger went down (not decreasing
        from point to point). A frame goes out every 16 ms at the position interpolated linearly between the points;
        the last frame is the last point, then the finger lifts there. If the first `t` is above 0 the finger waits at
        the first point until then. The last `t` is at most 60000 (60 seconds). Use it to draw curves without a
        WebSocket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PathRequest"
            examples:
              curve:
                value:
                  space: screen
                  points:
                    - { "x": 0.2, "y": 0.5, "t": 0 }
                    - { "x": 0.5, "y": 0.3, "t": 200 }
                    - { "x": 0.8, "y": 0.5, "t": 400 }
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ConflictTouch"
        "499":
          $ref: "#/components/responses/Cancelled"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/touch/pinch:
    post:
      operationId: pinch
      tags: [touch]
      summary: Pinch (two fingers)
      description: |
        Two fingers are placed side by side horizontally around `center`, each `radius` away from it, and the radius
        goes from `startRadius` to `endRadius` in `durationMs` (at least 70 ms in all). The radius is a fraction of
        the screen's **short side** (in `device` space: of the digitizer's x axis, which spans the device's short
        side). `endRadius` larger than `startRadius` spreads the fingers (zoom in), smaller pinches them together. A
        finger that would leave the screen at the start or the end is `400` `invalid_request`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinchRequest"
            examples:
              zoomIn:
                value: { "center": { "x": 0.5, "y": 0.5 }, "startRadius": 0.1, "endRadius": 0.3 }
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ConflictTouch"
        "499":
          $ref: "#/components/responses/Cancelled"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/touch/tap-text:
    post:
      operationId: tapText
      tags: [touch, text]
      summary: Find text on the screen and tap it
      description: |
        Reads the screen (OCR), finds `text`, and taps the centre of the match (moved by `offset`) like `POST /v1/touch/tap`.
        An operation: it is `busy` while another operation or a stream runs, and it needs what a tap needs.

        * **Waiting**: with `timeoutMs` above 0 the screen is read again every `pollMs` until the text is found. Not found
          in time is `409` `text_not_found`.
        * **Confirming**: once found, the screen is read again after `settleMs` (default 250, also with `timeoutMs: 0`),
          and the tap only happens when the same match is there (its centre moved at most 2 % of the short side). This
          keeps a tap off a screen that is still moving (a transition, scrolling). `settleMs: 0` skips the confirmation.
        * **Several matches**: `select: unique` (default) answers `409` `ambiguous_text` with the candidates in `matches`.
          Narrow the search with `region` (preferred) or choose with `select: first` or `select: index`. The order of
          the matches is the reading order; it can change from one reading to the next, so `index` is for screens that
          do not move.
        * **The user has priority**: while it searches it does not hold back the user's mouse and keys. When the user uses the mirror
          meanwhile, it ends with `409` `user_interrupted` and taps nothing. It holds back the user's input only for the tap.
        * The point is decided again just before the tap: if the screen rotated, or the assumed rotation changed, since
          the picture the match was found on, it is `409` `picture_changed` (also with `space: "screen"`) and nothing is
          tapped.
        * `offset` that puts the tap outside the screen is `409` `tap_outside_screen`.
        * `timeoutMs` + `settleMs` + 2000 + the time of the taps must be at most 60 seconds, else `400`.
        * Checks in this order, after the common ones: the license, the body (`400`), the trial quota (`403`), `not_running`, `busy`,
          `user_active`, `not_connected`, `no_picture`, the engine and the language (`ocr_unavailable`), the limits
          (`429`), the capture, `picture_changed` (`ref`), the recognition.
        * `text_not_found`, `ambiguous_text` and `tap_outside_screen` carry `matches` (at most 20 candidates) and
          `matchCount`. `POST /v1/cancel` stops it (`499`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TapTextRequest"
            examples:
              simple:
                summary: Tap "Wi-Fi"
                value: { "text": "Wi-Fi" }
              wait:
                summary: Wait up to 3 seconds for "完了" and tap it
                value: { "text": "完了", "lang": "ja", "timeoutMs": 3000 }
              switch:
                summary: Tap to the right of a label (a switch in a settings row)
                value: { "text": "Bluetooth", "offset": { "x": 0.4, "y": 0 }, "select": "first" }
      responses:
        "200":
          description: The text was found, confirmed and tapped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TapTextResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            The preconditions of `POST /v1/touch/tap` (`busy`, `not_running`, `user_active`, `not_connected`, `no_picture`,
            `picture_changed`, `user_interrupted`), or `ocr_unavailable`, `text_not_found`, `ambiguous_text`,
            `tap_outside_screen`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                ambiguous:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    detail: "the text was found more than once; narrow it with region, or choose with select"
                    code: ambiguous_text
                    matches:
                      - { text: OK, lineText: OK, box: { x: 0.25, y: 0.125, width: 0.125, height: 0.05 }, center: { x: 0.3125, y: 0.15 }, boxLevel: word }
                      - { text: OK, lineText: OK, box: { x: 0.25, y: 0.75, width: 0.125, height: 0.05 }, center: { x: 0.3125, y: 0.775 }, boxLevel: word }
                    matchCount: 2
        "429":
          $ref: "#/components/responses/RateLimited"
        "499":
          $ref: "#/components/responses/Cancelled"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/keys/press:
    post:
      operationId: pressKey
      tags: [keys]
      summary: Press one key (with modifiers)
      description: |
        Presses a key of a US keyboard for `holdMs` (default 30; unlike a touch it is not raised to 70) and releases
        it. The names are the **device's**: the app does not translate PC key layouts (`cmd` is the device's Command
        key, not the PC's Ctrl).

        * Characters: `a` to `z` (lower case), `0` to `9` and the unshifted US symbols `` - = [ ] \ ; ' , . / ` ``.
          A character that needs Shift on its own (`A`, `!`) is refused: send the base key with the `shift` modifier.
        * Names (not case sensitive): `Enter`, `Escape`, `Backspace`, `Tab`, `Space`, `Delete`, `ArrowUp`,
          `ArrowDown`, `ArrowLeft`, `ArrowRight`, `PageUp`, `PageDown`, `Home`, `End`, `F1` to `F12`.
        * Modifiers (`modifiers`): `cmd`, `shift`, `option`, `ctrl`.
        * `Home` is the keyboard key of that name. The device's home **button** is `POST /v1/home`.

        Needs the keyboard in the published HID map (`409` `no_keyboard` otherwise). Examples: select all
        `{ "key": "a", "modifiers": ["cmd"] }`; switch the input method `{ "key": "Space", "modifiers": ["ctrl"] }`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyPressRequest"
            examples:
              selectAll:
                value: { "key": "a", "modifiers": ["cmd"] }
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ConflictKey"
        "499":
          $ref: "#/components/responses/Cancelled"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/keys/type:
    post:
      operationId: typeText
      tags: [keys]
      summary: Type a text, one character at a time
      description: |
        Types `text` on a US keyboard, a character every `intervalMs` (plus about 30 ms of key hold; Shift costs
        about 30 ms more). At most 1000 characters, and the estimated time must stay within 60 seconds (else
        `400` `invalid_request`; split the text into several requests). New lines are typed as Enter and tabs as Tab.

        Characters that have no key on a US keyboard (Japanese, emoji, accented letters) are **not typed**; they are
        returned in `skipped`. Japanese cannot be typed directly: switch the device to its "Japanese - Romaji"
        keyboard (for example with `ctrl` + `Space`), type the romaji and confirm with the keys.

        Needs the keyboard in the published HID map (`409` `no_keyboard` otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TypeTextRequest"
            examples:
              hello:
                value: { "text": "hello", "intervalMs": 20 }
      responses:
        "200":
          description: The text was typed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypeTextResponse"
              examples:
                allTyped:
                  value: { "skipped": "" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ConflictKey"
        "499":
          $ref: "#/components/responses/Cancelled"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/home:
    post:
      operationId: home
      tags: [keys]
      summary: Press the home button
      description: |
        Sends the home key (Consumer Control "Menu") of the device. Needs the home button in the published HID map
        (`409` `no_home_button` otherwise). No body.
      responses:
        "200":
          $ref: "#/components/responses/Empty"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            `not_running`, `busy`, `user_active`, `not_connected`, `no_home_button` or `user_interrupted`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "499":
          $ref: "#/components/responses/Cancelled"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/cancel:
    post:
      operationId: cancel
      tags: [control]
      summary: Stop the running operation
      description: |
        Ends the operation or WebSocket stream that is running: every finger is lifted and every key released. The
        stopped REST request answers `499` `cancelled`; a stream gets an `interrupted` event with reason `cancelled`
        and is closed. Answers at once; `cancelled` tells whether something was running. No body. This call works even when
        the license does not cover the API (a stop command always works).
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResponse"
              examples:
                stopped:
                  value: { "cancelled": true }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/screenshot:
    get:
      operationId: getScreenshot
      tags: [status]
      summary: A picture of the device screen
      description: |
        The picture of the device as the receiver window shows it: exactly the rectangle that `GET /v1/status` reports as
        `picture` (the black bars of the window are left out), as a PNG or a JPEG. The image is made from the receiver window
        alone, so other windows (notifications, overlays) do not appear in it. For about 2 seconds after a screenshot is taken, a colored border
        (usually yellow) is shown around the receiver window; the border is not in the image. If Windows' capture is temporarily
        unavailable (rare), a screenshot may be taken without the border.

        * The image size follows the **size of the receiver window**, not the resolution of the device. Use the size of
          the screenshot you took as `ref` when you point at it with `space: "pixel"`.
        * `maxSize` only shrinks (the longest side becomes `maxSize`, the aspect stays); it never enlarges. Without it the
          image has the size of the picture. The header `X-IceScreenTouch-Source-Size` always has the size before shrinking.
        * The image has no transparency.
        * Not an operation: it takes no part in the one-operation-at-a-time rule, so it also works while an operation or a
          WebSocket stream runs; it never answers `busy`. It sends nothing to the device.
        * At most **10 screenshots in any 1 second**, counted over all clients. The 11th gets `429` `rate_limited` with
          `Retry-After: 1`. Only requests that passed the query check count (also when they are then answered `not_running`
          or `no_picture`); a request refused with `429` does not count. Too many screenshots in progress at once are also
          answered `429` `rate_limited`.
        * Checks in this order, after the common ones (`Origin`, `Host`, token): the license (`403` `purchase_required`), the
          query (`400` `invalid_request`), the trial quota (`403` `purchase_required`, `reason` `trial_limit`), the rate limit (`429`), `409` `not_running`, `409` `no_picture` (no picture: the
          receiver window is closed, minimized, on another virtual desktop or not found, or it could not be read).
        * The query parameter names are case-sensitive and the values are exact: `format` is `png` or `jpeg` in lower case;
          `maxSize` and `quality` are plain decimal digits. An unknown or repeated parameter, a value out of range, and
          `quality` with `format=png` are `400` `invalid_request`.
      parameters:
        - name: format
          in: query
          required: false
          description: The image format. Lower case.
          schema:
            type: string
            enum: [png, jpeg]
            default: png
        - name: maxSize
          in: query
          required: false
          description: |
            The longest side of the image in pixels. The image is shrunk to it when it is larger and is not touched when it
            is smaller or equal. Without it the image keeps the size of the picture.
          schema:
            type: integer
            minimum: 16
            maximum: 8192
        - name: quality
          in: query
          required: false
          description: The JPEG quality. Only with `format=jpeg` (with `png` it is `400` `invalid_request`).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 90
      responses:
        "200":
          description: |
            The image. The body is the file (`Content-Type` is `image/png` or `image/jpeg`); the headers say how the app saw
            the picture when it was taken.
          headers:
            X-IceScreenTouch-Orientation:
              description: "`portrait`, or `landscape` when the picture is wider than tall (a square one is `portrait`)."
              required: true
              schema:
                type: string
                enum: [portrait, landscape]
            X-IceScreenTouch-Rotation:
              description: The rotation the app assumes for that orientation (see `GET /v1/rotation`), in degrees.
              required: true
              schema:
                type: string
                enum: ["0", "90", "180", "270"]
            X-IceScreenTouch-Source-Size:
              description: The size of the picture before `maxSize` shrank it, `<width>x<height>` in pixels, for example `1179x2556`.
              required: true
              schema:
                type: string
                pattern: "^[0-9]+x[0-9]+$"
          content:
            image/png:
              schema:
                type: string
                contentMediaType: image/png
                contentEncoding: binary
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
                contentEncoding: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            `not_running` (the mirroring session is not running) or `no_picture` (the receiver window is closed, minimized,
            on another virtual desktop or not found, or it could not be read).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                noPicture:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    detail: "there is no picture of the device"
                    code: no_picture
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/text/read:
    post:
      operationId: readText
      tags: [text]
      summary: Read the text of the screen
      description: |
        Reads the screen with OCR: the lines in reading order (top to bottom, then left to right), with their boxes, and
        their words when `words` is true. No text is not an error (`lines: []`).

        * Not an operation (like `GET /v1/screenshot`): it works while an operation or a stream runs and never answers
          `busy`. It sends nothing to the device.
        * Without `lang`, the first of the Windows user's languages that has OCR. When nothing is found, check that the
          language matches the screen (`language` in the answer).
        * `region` reads only part of the screen (lines whose centre is inside it); smaller pictures are read faster.
        * Checks in this order, after the common ones: the license, the body (`400`), the trial quota (`403`), the engine and the language
          (`409` `ocr_unavailable`), the limits (`429`), `not_running`, `no_picture`, the capture, `picture_changed` (a
          `pixel` `ref` of the other orientation), the recognition.
        * The text is sent to the client only (as the screenshot is); the app logs neither the text nor the boxes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextReadRequest"
            examples:
              all:
                summary: Read the whole screen in the default language
                value: {}
              japanese:
                summary: Read the top half in Japanese, with the words
                value: { "lang": "ja", "region": { "x": 0, "y": 0, "width": 1, "height": 0.5 }, "words": true }
      responses:
        "200":
          description: The text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextReadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ConflictText"
        "429":
          $ref: "#/components/responses/RateLimited"
        "499":
          $ref: "#/components/responses/Cancelled"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/text/find:
    post:
      operationId: findText
      tags: [text]
      summary: Find text on the screen, or wait for it
      description: |
        The places where `text` is on the screen (see the matching rules in the introduction). With `timeoutMs` above 0
        the screen is read again every `pollMs` until it is found. Not found is an empty `matches`, not an error.

        * Not an operation, like `POST /v1/text/read`. `POST /v1/cancel` does not stop it; the client closing the
          connection does.
        * While it waits, a stopped session or a missing picture ends it at once (`not_running`, `no_picture`).
        * Checks in the order of `POST /v1/text/read`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextFindRequest"
            examples:
              exact:
                summary: Find the label "設定"
                value: { "text": "設定" }
              wait:
                summary: Wait up to 5 seconds for a line that contains "Done", ignoring look-alike characters
                value: { "text": "Done", "match": "contains", "loose": true, "timeoutMs": 5000 }
      responses:
        "200":
          description: The matches (empty when the text was not found).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextFindResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ConflictText"
        "429":
          $ref: "#/components/responses/RateLimited"
        "499":
          $ref: "#/components/responses/Cancelled"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/stream:
    get:
      operationId: stream
      tags: [stream]
      summary: Low-level input over a WebSocket
      security: []
      description: |
        Upgrades the connection to a WebSocket (`Upgrade: websocket`; response `101`) for low-level input: put one or
        two fingers down, move them, lift them, press and release keys, all in real time. OpenAPI cannot describe a
        WebSocket; the protocol is described here, and the messages are the schemas `StreamClientMessage` and
        `StreamEvent` in this document. Messages are JSON in **text** frames (a binary frame closes the connection
        with 1003), at most **4 KB** each (a larger one closes it with 1009).

        ## Handshake and authentication

        There is no `Authorization` header (a browser cannot set one on a WebSocket) and the `Origin` and `Host`
        checks of the API still apply before the upgrade (`403` `forbidden_origin`). The **first message** must be
        `{ "op": "auth", "token": "<token>" }`, within **2 seconds** of the upgrade. A wrong or late first message is
        answered with an `error` event (`unauthorized`) and the close code 1008.

        After a good `auth` the stream opens a **session**: it behaves like a running operation, so every other
        operation answers `409` `busy` while the stream is open (`GET /v1/status`, `GET /v1/rotation` and the
        specification still work), the user's mouse and keys are held back from the device, and the same preconditions
        as for touches apply (session running, device connected, user not active). The server sends
        `{ "ev": "ready", "api": 1 }`. If the session cannot be opened the server sends an `error` event with the
        reason (`purchase_required`, `busy`, `user_active`, `not_connected`, `not_running`) and closes
        (see the close codes). At most 4 streams can be connected at once, but only one can hold the session; beyond 4
        the upgrade itself is refused with `409` `busy`. A request that is not a WebSocket upgrade is `400`
        `invalid_request`.

        ## Messages from the client

        Every message below except `auth` and `ping` has a number `seq` (an integer, 0 or more) that the answer
        repeats. Members that an `op` does not take are refused (`error`, `invalid_request`). A message that is not a
        valid JSON object of this API is answered with an `error` event without `seq`; the stream stays open.

        | op | members | effect |
        |---|---|---|
        | `auth` | `token` | First message only. |
        | `down` | `seq`, `contacts`, optional `space` (default `screen`), optional `ref` | Puts the listed fingers down (a finger that is already down moves). `space` and `ref` apply to the following `move` messages too. |
        | `move` | `seq`, `contacts` | Moves fingers that are down (each must be down first). |
        | `up` | `seq` | Lifts every finger at its last position. |
        | `key` | `seq`, `key`, optional `modifiers`, `down` | Presses (`down: true`) or releases (`false`) a key; names and modifiers as in `POST /v1/keys/press`. At most 6 keys can be down at once. |
        | `ping` | none | Answered with `{ "ev": "pong" }`; keeps the stream alive. |

        `contacts` has 1 or 2 entries `{ "id": 0 or 1, "x", "y" }` (unique ids; the digitizer has two points). The
        coordinates are those of `space` (see the coordinate spaces in the description of this API); the picture and
        the rotation are read again for every message, so a rotation or a new picture is honoured.

        ## Messages from the server

        | ev | members | meaning |
        |---|---|---|
        | `ready` | `api` | The stream is open. |
        | `ack` | `seq` | The message with this `seq` was carried out (sent to the device). |
        | `error` | `seq` (when known), `code`, `detail`; with the trial quota also `reason`, `limit`, `counter` | The message was refused and did nothing. `code` is a code of the `Problem` schema (`invalid_request`, `not_connected`, `no_picture`, `picture_changed`, `no_keyboard`, ...). The stream stays open, except where a close code is listed below. |
        | `interrupted` | `reason` | `user` (the user took over), `cancelled` (`POST /v1/cancel` or the server stops) or `session_ended` (the mirroring session ended): everything was lifted and released and the stream is closed. `idle`: see the dead-man below; the stream stays open. |
        | `pong` | none | The answer to `ping`. |

        ## Timing and the dead-man

        * `move` messages are applied at most once every 16 ms: moves that arrive in between are merged into the last
          position and acknowledged as applied (every `seq` gets its `ack`).
        * **Dead-man**: while a finger or key is down, if no message arrives for **1 second**, everything is lifted
          and released and the server sends `{ "ev": "interrupted", "reason": "idle" }`. The stream stays open. To hold
          a finger still, send `ping` regularly.
        * More than 1000 frames in a second close the stream (1008, `error` `rate_limited`). Real use is 60 to 125 a
          second.
        * When the stream ends for any reason (a client close, a broken connection, the user, the server) every finger
          is lifted and every key released first, then the session is given up.
        * **Trial**: opening the stream counts one operation of the trial quota (when the operations are used up, the
          stream is refused: `error` `purchase_required` with `reason: "trial_limit"`, `counter: "operations"`, then
          1008). An open stream ends after **5 minutes** (`error` `purchase_required` with `reason: "trial_limit"`,
          `limit: 300`, `counter: "stream_seconds"`, then 1008); open a new stream to go on.

        ## Close codes

        | code | when |
        |---|---|
        | 1000 | The client closed the stream; or the user, `POST /v1/cancel` or the end of the mirroring session stopped it (an `interrupted` event came first). |
        | 1001 | The app is shutting down; or the session could not be opened because the request was cancelled. |
        | 1003 | A binary frame. |
        | 1008 | Authentication failed or timed out; the token was regenerated; the API is not covered by the license, or the trial quota is used up or the trial's 5 minutes of the stream are over (`purchase_required`); too many messages per second. An `error` event comes first. |
        | 1009 | A message larger than 4 KB. |
        | 1011 | An internal error (for example a failed Bluetooth write); an `error` event (`internal_error`) comes first. |
        | 1013 | Try again later: the session could not be opened because of `busy`, `user_active`, `not_connected` or `not_running`. An `error` event with that code comes first. |

        Example session:

        ```
        -> { "op": "auth", "token": "..." }
        <- { "ev": "ready", "api": 1 }
        -> { "op": "down", "seq": 1, "space": "screen", "contacts": [{ "id": 0, "x": 0.2, "y": 0.5 }] }
        <- { "ev": "ack", "seq": 1 }
        -> { "op": "move", "seq": 2, "contacts": [{ "id": 0, "x": 0.8, "y": 0.5 }] }
        <- { "ev": "ack", "seq": 2 }
        -> { "op": "up", "seq": 3 }
        <- { "ev": "ack", "seq": 3 }
        ```
      responses:
        "101":
          description: Switching protocols. The WebSocket is open.
        "400":
          description: "`invalid_request`: the request is not a WebSocket upgrade."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "`forbidden_origin`: an `Origin` header is present, or `Host` is not allowed."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "`busy`: 4 streams are already connected."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/openapi.json:
    get:
      operationId: getOpenApi
      tags: [spec]
      summary: This specification as JSON
      security: []
      description: |
        The specification (the same document as this file, in JSON). It needs no token; the `Origin` and `Host`
        checks still apply.
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          content:
            application/json:
              schema:
                type: object
        "403":
          description: "`forbidden_origin`: an `Origin` header is present, or `Host` is not allowed."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        The token of `api.json` (or `ICESCREENTOUCH_TOKEN`), 43 Base64url characters. Sent as
        `Authorization: Bearer <token>`.

  responses:
    Empty:
      description: Done. The body is `{}`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Empty"
    BadRequest:
      description: |
        `invalid_request`: the body, a range, a limit or a name is wrong. `detail` says which (never the value).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            outOfRange:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                detail: "position is outside the screen (x and y must be in 0..1)"
                code: invalid_request
    Unauthorized:
      description: "`unauthorized`: the bearer token is missing or wrong."
      headers:
        WWW-Authenticate:
          description: Always `Bearer`.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        `forbidden_origin` (an `Origin` header is present, or `Host` is not `127.0.0.1:<port>`)
        or `purchase_required` (the license does not cover the API, or the trial quota is used up: `reason`
        `trial_limit`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            trialLimit:
              summary: The trial quota is used up
              value:
                type: about:blank
                title: Forbidden
                status: 403
                detail: the trial allows 300 operations in total and they are used up; buy IceScreen Touch for unlimited use
                code: purchase_required
                reason: trial_limit
                limit: 300
                counter: operations
    ConflictTouch:
      description: |
        The operation cannot run now: `busy` (another operation, a stream or the probe page is running), `not_running`
        (the mirroring session is not running), `user_active` (the user used the mirror within the last second),
        `not_connected` (the target device has not subscribed to the touch reports), `no_picture` (`screen` and `pixel`
        need the picture), `picture_changed` (a `pixel` request whose `ref` has the opposite orientation of the
        picture; for `tap-text` also a rotation while it searched, in any space) or `user_interrupted` (the user took
        over while it ran; everything was lifted).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            busy:
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: "another operation or session is running"
                code: busy
    ConflictText:
      description: |
        The text cannot be read now: `ocr_unavailable` (no OCR for the language on this PC, or no such engine; the
        extension members `reason`, `engine`, `available` and `engines` say what there is), `not_running`, `no_picture`,
        or `picture_changed` (a `pixel` request whose `ref` has the opposite orientation of the picture).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            noLanguage:
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: "this PC has no OCR for that language; see available"
                code: ocr_unavailable
                reason: language
                engine: windows
                available: [en-US, ja]
                engines: [windows]
    ConflictKey:
      description: |
        The operation cannot run now: `busy`, `not_running`, `user_active`, `not_connected`, `no_keyboard` (the
        published HID map has no keyboard) or `user_interrupted`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Cancelled:
      description: |
        `cancelled`: `POST /v1/cancel` (or the client going away) ended the operation. Every finger was lifted and
        every key released.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: |
        `rate_limited`: more than 10 screenshots and text readings in one second, or more than 5 text readings (over
        all clients); too many screenshots or text readings in progress at once; more than two `find` or `tap-text`
        calls with `timeoutMs` at once; or the OCR engine is busy. Try again after the time in `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait before the next try. Always `1`.
          required: true
          schema:
            type: string
            enum: ["1"]
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            tooMany:
              value:
                type: about:blank
                title: Too Many Requests
                status: 429
                detail: "at most 10 screenshots per second"
                code: rate_limited
    InternalError:
      description: |
        `internal_error`: an unexpected failure inside the app (for example a failed Bluetooth write). The detail is
        generic.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    # ---- Errors -------------------------------------------------------------------------------------------
    Problem:
      type: object
      description: |
        An error, RFC 9457 `application/problem+json`. The meaning is in `code`.

        | code | HTTP | meaning |
        |---|---|---|
        | `invalid_request` | 400 | The body, a range, a limit or a name is wrong. |
        | `unauthorized` | 401 | The token is missing or wrong. |
        | `forbidden_origin` | 403 | The `Origin` header is present, or `Host` is not allowed. |
        | `purchase_required` | 403 | The license does not cover the API (the trial ended), or the trial quota is used up (`reason` `trial_limit`, see `limit` and `counter`). |
        | `not_found` | 404 | No such endpoint. |
        | `method_not_allowed` | 405 | The endpoint does not accept that HTTP method (`Allow` lists the ones it does). |
        | `not_running` | 409 | The mirroring session is not running. |
        | `not_connected` | 409 | The target device has not subscribed to the HID reports. |
        | `no_picture` | 409 | There is no picture (the receiver window is closed or minimized, or it could not be read) and the request needs one. |
        | `picture_changed` | 409 | A `pixel` request refers to a screenshot of the opposite orientation: the device rotated since. For `tap-text`, also the screen (or the assumed rotation) changed while it searched, in any space. |
        | `busy` | 409 | Another operation, a WebSocket stream or the probe page is running. |
        | `user_interrupted` | 409 | The user used the mirror; everything was lifted. |
        | `user_active` | 409 | The user used the mirror within the last second, or holds the mouse or a key. |
        | `no_keyboard` | 409 | The published HID map has no keyboard. |
        | `no_home_button` | 409 | The published HID map has no home button. |
        | `ocr_unavailable` | 409 | No OCR for the language on this PC, no such OCR engine, or the engine stopped answering. See `reason`, `available`, `engines`. |
        | `text_not_found` | 409 | `tap-text` did not find the text (the `index`-th match) in time. |
        | `ambiguous_text` | 409 | `tap-text` with `select: unique` found the text more than once. See `matches`. |
        | `tap_outside_screen` | 409 | The `offset` of `tap-text` puts the tap outside the screen. |
        | `rate_limited` | 429 | More than 10 screenshots and text readings in one second (or 5 text readings), or too many in progress at once (`Retry-After: 1`), or too many messages per second on a WebSocket stream (it is closed). |
        | `cancelled` | 499 | `POST /v1/cancel` (or the client going away) ended the operation. |
        | `internal_error` | 500 | An unexpected failure inside the app. |
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
          description: The HTTP status text.
        status:
          type: integer
          description: The HTTP status.
        detail:
          type: string
          description: A sentence for a person. Never contains positions, keys, text or the token.
        code:
          type: string
          description: The machine-readable error code.
          enum:
            - invalid_request
            - unauthorized
            - forbidden_origin
            - purchase_required
            - not_found
            - method_not_allowed
            - not_running
            - not_connected
            - no_picture
            - picture_changed
            - busy
            - user_interrupted
            - user_active
            - no_keyboard
            - no_home_button
            - ocr_unavailable
            - text_not_found
            - ambiguous_text
            - tap_outside_screen
            - rate_limited
            - cancelled
            - internal_error
        reason:
          type: string
          enum: [language, engine, trial_limit]
          description: "`ocr_unavailable`: the language or the engine is missing (`language`, `engine`). `purchase_required`: `trial_limit`, the trial quota is used up (absent when the license does not cover the API)."
        limit:
          type: integer
          minimum: 0
          description: "`purchase_required` with `trial_limit` only: the limit of the counter that is used up (it never resets)."
        counter:
          type: string
          enum: [operations, captures]
          description: "`purchase_required` with `trial_limit` only: the counter that is used up."
        engine:
          type: string
          description: "`ocr_unavailable` only: the engine asked for (left out when the app has no engine at all)."
        available:
          type: array
          items:
            type: string
          description: "`ocr_unavailable` only: the languages that engine can read on this PC (may be empty)."
        engines:
          type: array
          items:
            type: string
          description: "`ocr_unavailable` only: the engines that can be used."
        matches:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/TextMatch"
          description: "`text_not_found`, `ambiguous_text`, `tap_outside_screen`: the candidates on the last picture (at most 20)."
        matchCount:
          type: integer
          minimum: 0
          description: "With `matches`: the number of matches (also those beyond the 20 listed)."
      examples:
        - type: about:blank
          title: Conflict
          status: 409
          detail: the user used the mirror a moment ago
          code: user_active

    Empty:
      type: object
      description: The body of an operation that returns nothing.
      additionalProperties: false

    # ---- Responses ----------------------------------------------------------------------------------------
    Status:
      type: object
      description: The state of the app.
      required: [version, apiVersion, running, bleState, devices, targetDeviceId, receiver, picture, rotation, operating, ocr]
      properties:
        version:
          type: string
          description: The version of the app.
        apiVersion:
          type: integer
          description: The major version of the API (1).
        running:
          type: boolean
          description: The mirroring session is running.
        bleState:
          type: string
          description: A short description of the Bluetooth state, for example `advertising` or `connected`.
        devices:
          type: array
          description: The devices that connected.
          items:
            $ref: "#/components/schemas/Device"
        targetDeviceId:
          type: [string, "null"]
          description: The device that gets the input (`null` when there is none).
        receiver:
          type: [string, "null"]
          description: The AirPlay receiver the picture comes from (`null` when there is none).
        picture:
          oneOf:
            - $ref: "#/components/schemas/Picture"
            - type: "null"
          description: The picture of the device as the receiver window shows it (`null` when there is none).
        rotation:
          $ref: "#/components/schemas/Rotation"
        operating:
          type: boolean
          description: An API operation or stream is running.
        ocr:
          $ref: "#/components/schemas/OcrStatus"
        trial:
          $ref: "#/components/schemas/TrialQuota"
      examples:
        - version: 0.3.0
          apiVersion: 1
          running: true
          bleState: connected
          devices:
            - { id: iphone-1, name: iPhone, model: "iPhone15,2", subscribed: true }
          targetDeviceId: iphone-1
          receiver: UxPlay
          picture: { width: 390, height: 844, isLandscape: false, orientation: portrait, aspect: 0.462 }
          rotation: { landscape: 90, portrait: 0 }
          operating: false
          ocr:
            available: true
            engine: { id: windows, name: Windows.Media.Ocr, version: "10.0.26100", kind: builtin, capabilities: { wordBoxes: true, confidence: false } }
            engines: [{ id: windows, name: Windows.Media.Ocr, kind: builtin, available: true }]
            languages: [en-US, ja]
            defaultLanguage: ja

    TrialQuota:
      type: object
      description: |
        `trial` of `GET /v1/status`: what is left of the trial quota. Present only in the trial of the Microsoft Store app
        (left out when the app is bought or built from the source). The counts are for the whole trial and never reset.
      required: [operationsLeft, operationsLimit, capturesLeft, capturesLimit, streamLimitSeconds]
      additionalProperties: false
      properties:
        operationsLeft:
          type: integer
          minimum: 0
          description: Operations left (touches, keys, home, `tap-text`, WebSocket streams).
        operationsLimit:
          type: integer
          minimum: 0
          description: Operations in the whole trial (300).
        capturesLeft:
          type: integer
          minimum: 0
          description: Captures left (screenshots, `text/read`, `text/find`).
        capturesLimit:
          type: integer
          minimum: 0
          description: Captures in the whole trial (300).
        streamLimitSeconds:
          type: integer
          minimum: 1
          description: The longest a WebSocket stream stays open, in seconds (300).
      examples:
        - { operationsLeft: 152, operationsLimit: 300, capturesLeft: 171, capturesLimit: 300, streamLimitSeconds: 300 }

    Device:
      type: object
      required: [id, name, model, subscribed]
      properties:
        id:
          type: string
          description: The id that `PUT /v1/target` takes.
        name:
          type: string
          description: The name the device advertises.
        model:
          type: [string, "null"]
          description: The model, when known.
        subscribed:
          type: boolean
          description: The device subscribed to the touch reports (it can receive input).

    Picture:
      type: object
      description: |
        The rectangle of the device's picture in the receiver window (black bars excluded), in PC pixels. The width
        and height are not the device's resolution.
      required: [width, height, isLandscape, orientation, aspect]
      properties:
        width:
          type: integer
        height:
          type: integer
        isLandscape:
          type: boolean
          description: Wider than tall. A square counts as portrait.
        orientation:
          type: string
          enum: [portrait, landscape]
        aspect:
          type: number
          description: Width divided by height.

    Rotation:
      type: object
      description: The rotations of the device the app assumes, in degrees.
      required: [landscape, portrait]
      properties:
        landscape:
          type: integer
          enum: [90, 270]
          description: Used when the picture is wide.
        portrait:
          type: integer
          enum: [0, 180]
          description: Used when the picture is tall.

    TypeTextResponse:
      type: object
      required: [skipped]
      properties:
        skipped:
          type: string
          description: The characters that have no key on a US keyboard (not typed). Empty when all were typed.

    CancelResponse:
      type: object
      required: [cancelled]
      properties:
        cancelled:
          type: boolean
          description: True when an operation or stream was running and was told to stop; false when nothing ran.

    OcrStatus:
      type: object
      description: Text recognition (OCR). The languages are read again on every request.
      required: [available, engine, engines, languages, defaultLanguage]
      properties:
        available:
          type: boolean
          description: Text can be read now (the default engine works and Windows has at least one OCR language).
        engine:
          description: The default engine (`null` when the app has none).
          oneOf:
            - $ref: "#/components/schemas/OcrEngineDetail"
            - type: "null"
        engines:
          type: array
          description: Every engine. The app has one, `windows`.
          items:
            $ref: "#/components/schemas/OcrEngineSummary"
        languages:
          type: array
          description: The OCR languages of the default engine (the ones Windows has installed), as BCP 47 tags.
          items:
            type: string
        defaultLanguage:
          type: [string, "null"]
          description: The language used when a request has no `lang`.

    OcrEngineDetail:
      type: object
      required: [id, name, version, kind, capabilities]
      properties:
        id:
          type: string
          description: The id a request can name in `engine` (`windows`).
        name:
          type: string
          description: The engine's name (`Windows.Media.Ocr`).
        version:
          type: string
          description: A version hint (for Windows.Media.Ocr, the Windows build; the language data is updated by Windows Update).
        kind:
          type: string
          enum: [builtin, external]
        capabilities:
          type: object
          required: [wordBoxes, confidence]
          properties:
            wordBoxes:
              type: boolean
              description: "Words have their own boxes. When false, matches are located by whole lines (`boxLevel: line`)."
            confidence:
              type: boolean
              description: Results carry `confidence` (Windows.Media.Ocr gives none).

    OcrEngineSummary:
      type: object
      required: [id, name, kind, available]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [builtin, external]
        available:
          type: boolean
          description: The engine can be used now.

    TextBox:
      type: object
      description: A rectangle (top left and size) in the request's space.
      required: [x, y, width, height]
      properties:
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number

    TextPoint:
      type: object
      description: A point in the request's space.
      required: [x, y]
      properties:
        x:
          type: number
        y:
          type: number

    TextPicture:
      type: object
      description: The picture the text was read from; the same meaning as the headers of `GET /v1/screenshot`.
      required: [width, height, orientation, rotation]
      properties:
        width:
          type: integer
        height:
          type: integer
        orientation:
          type: string
          enum: [portrait, landscape]
        rotation:
          type: integer
          enum: [0, 90, 180, 270]

    TextEngine:
      type: object
      description: The engine that read the text.
      required: [id, name, version]
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string

    TextWord:
      type: object
      required: [text, box]
      properties:
        text:
          type: string
        box:
          $ref: "#/components/schemas/TextBox"
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Only when the engine gives one.

    TextLine:
      type: object
      required: [text, box, center]
      properties:
        text:
          type: string
          description: The line. Words are joined by a space, except between kana, kanji and full-width characters.
        box:
          $ref: "#/components/schemas/TextBox"
        center:
          $ref: "#/components/schemas/TextPoint"
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Only when the engine gives one.
        words:
          type: array
          description: Only when the request asked for `words`.
          items:
            $ref: "#/components/schemas/TextWord"

    TextMatch:
      type: object
      required: [text, lineText, box, center, boxLevel]
      properties:
        text:
          type: string
          description: The words that matched.
        lineText:
          type: string
          description: The whole line.
        box:
          $ref: "#/components/schemas/TextBox"
        center:
          $ref: "#/components/schemas/TextPoint"
        boxLevel:
          type: string
          enum: [word, line]
          description: |
            `word`: the box is the matched words'. `line`: the engine has no word boxes and the box is the whole line's (a
            tap at its centre may miss part of a line; narrow with `region` or move with `offset`).
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Only when the engine gives one.

    TextReadResponse:
      type: object
      required: [language, engine, picture, space, durationMs, lines]
      properties:
        language:
          type: string
          description: The language the recognizer used.
        engine:
          $ref: "#/components/schemas/TextEngine"
        picture:
          $ref: "#/components/schemas/TextPicture"
        space:
          type: string
          enum: [screen, pixel]
        durationMs:
          type: integer
          description: Capture and recognition.
        lines:
          type: array
          description: In reading order (top to bottom, then left to right).
          items:
            $ref: "#/components/schemas/TextLine"
      examples:
        - language: ja
          engine: { id: windows, name: Windows.Media.Ocr, version: "10.0.26100" }
          picture: { width: 498, height: 1080, orientation: portrait, rotation: 0 }
          space: screen
          durationMs: 92
          lines:
            - { text: メモ, box: { x: 0.1235, y: 0.2047, width: 0.0531, height: 0.0233 }, center: { x: 0.1501, y: 0.2164 } }

    TextFindResponse:
      type: object
      required: [language, engine, picture, space, durationMs, attempts, matches]
      properties:
        language:
          type: string
        engine:
          $ref: "#/components/schemas/TextEngine"
        picture:
          $ref: "#/components/schemas/TextPicture"
          description: The last picture that was read.
        space:
          type: string
          enum: [screen, pixel]
        durationMs:
          type: integer
          description: From the request to the answer.
        attempts:
          type: integer
          description: The readings made.
        matches:
          type: array
          description: In reading order; empty when the text was not found.
          items:
            $ref: "#/components/schemas/TextMatch"

    TapTextResponse:
      type: object
      required: [language, engine, picture, space, durationMs, attempts, tapped, matchCount]
      properties:
        language:
          type: string
        engine:
          $ref: "#/components/schemas/TextEngine"
        picture:
          $ref: "#/components/schemas/TextPicture"
          description: The picture the tap was decided on.
        space:
          type: string
          enum: [screen, pixel]
        durationMs:
          type: integer
          description: From the request to the lift.
        attempts:
          type: integer
          description: The readings made (with the confirming one).
        tapped:
          allOf:
            - $ref: "#/components/schemas/TextMatch"
          type: object
          required: [at]
          properties:
            at:
              $ref: "#/components/schemas/TextPoint"
              description: Where the finger went down (the centre plus `offset`).
        matchCount:
          type: integer
          description: The matches on that picture.

    # ---- Requests -----------------------------------------------------------------------------------------
    Space:
      type: string
      enum: [screen, pixel, device]
      default: screen
      description: |
        The coordinate space of the positions (not case sensitive): `screen` (0..1 of the screen as seen now),
        `pixel` (pixels of a screenshot; needs `ref`) or `device` (0..1 of the digitizer's portrait frame).

    PixelRef:
      type: object
      description: The size of the screenshot a `pixel` position refers to.
      required: [width, height]
      additionalProperties: false
      properties:
        width:
          type: integer
          minimum: 1
          description: Screenshot width in pixels.
        height:
          type: integer
          minimum: 1
          description: Screenshot height in pixels.

    PixelNeedsRef:
      description: When `space` is `pixel`, `ref` is required.
      if:
        required: [space]
        properties:
          space:
            const: pixel
      then:
        required: [ref]

    Point:
      type: object
      description: A position in the space of the request.
      required: [x, y]
      additionalProperties: false
      properties:
        x:
          type: number
          description: Horizontal position (0..1; for `pixel` 0..`ref.width`).
        y:
          type: number
          description: Vertical position (0..1; for `pixel` 0..`ref.height`).

    TargetRequest:
      type: object
      required: [deviceId]
      additionalProperties: false
      properties:
        deviceId:
          type: [string, "null"]
          description: The device id, or `null` for automatic. The member must be present.

    RotationRequest:
      type: object
      description: At least one of the two members.
      minProperties: 1
      additionalProperties: false
      properties:
        landscape:
          type: integer
          enum: [90, 270]
        portrait:
          type: integer
          enum: [0, 180]

    TapRequest:
      type: object
      required: [x, y]
      additionalProperties: false
      allOf:
        - $ref: "#/components/schemas/PixelNeedsRef"
      properties:
        x:
          type: number
          description: Horizontal position.
        y:
          type: number
          description: Vertical position.
        space:
          $ref: "#/components/schemas/Space"
        ref:
          $ref: "#/components/schemas/PixelRef"
        holdMs:
          type: integer
          minimum: 0
          default: 80
          description: How long the finger stays down. A value below 70 is raised to 70.
        count:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          description: Number of taps.
        intervalMs:
          type: integer
          minimum: 0
          default: 120
          description: The pause between a lift and the next tap. A value below 25 is raised to 25.

    LongPressRequest:
      type: object
      required: [x, y]
      additionalProperties: false
      allOf:
        - $ref: "#/components/schemas/PixelNeedsRef"
      properties:
        x:
          type: number
          description: Horizontal position.
        y:
          type: number
          description: Vertical position.
        space:
          $ref: "#/components/schemas/Space"
        ref:
          $ref: "#/components/schemas/PixelRef"
        holdMs:
          type: integer
          minimum: 0
          default: 800
          description: How long the finger stays down (at most 60000). A value below 70 is raised to 70.

    SwipeRequest:
      type: object
      required: [from, to]
      additionalProperties: false
      allOf:
        - $ref: "#/components/schemas/PixelNeedsRef"
      properties:
        from:
          $ref: "#/components/schemas/Point"
        to:
          $ref: "#/components/schemas/Point"
        space:
          $ref: "#/components/schemas/Space"
        ref:
          $ref: "#/components/schemas/PixelRef"
        durationMs:
          type: integer
          minimum: 0
          default: 300
          description: The time to move from `from` to `to`.
        holdBeforeMs:
          type: integer
          minimum: 0
          default: 0
          description: The finger waits at `from` this long first (a long press before the drag).
        holdAfterMs:
          type: integer
          minimum: 0
          default: 0
          description: The finger waits at `to` this long before the lift (stops the momentum).

    PathPoint:
      type: object
      required: [x, y, t]
      additionalProperties: false
      properties:
        x:
          type: number
          description: Horizontal position.
        y:
          type: number
          description: Vertical position.
        t:
          type: integer
          minimum: 0
          description: Milliseconds since the finger went down; not decreasing from point to point; at most 60000.

    PathRequest:
      type: object
      required: [points]
      additionalProperties: false
      allOf:
        - $ref: "#/components/schemas/PixelNeedsRef"
      properties:
        space:
          $ref: "#/components/schemas/Space"
        ref:
          $ref: "#/components/schemas/PixelRef"
        points:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/PathPoint"

    PinchRequest:
      type: object
      required: [center, startRadius, endRadius]
      additionalProperties: false
      allOf:
        - $ref: "#/components/schemas/PixelNeedsRef"
      properties:
        center:
          $ref: "#/components/schemas/Point"
        space:
          $ref: "#/components/schemas/Space"
        ref:
          $ref: "#/components/schemas/PixelRef"
        startRadius:
          type: number
          minimum: 0
          description: Half the distance between the fingers at the start, as a fraction of the screen's short side.
        endRadius:
          type: number
          minimum: 0
          description: Half the distance between the fingers at the end, as a fraction of the screen's short side.
        durationMs:
          type: integer
          minimum: 0
          default: 400
          description: The time from start to end (the whole gesture lasts at least 70 ms).

    KeyPressRequest:
      type: object
      required: [key]
      additionalProperties: false
      properties:
        key:
          type: string
          description: A key name, see `POST /v1/keys/press`.
        modifiers:
          type: array
          description: Modifier keys held while the key is pressed.
          items:
            type: string
            enum: [cmd, shift, option, ctrl]
        holdMs:
          type: integer
          minimum: 0
          default: 30
          description: How long the key stays down.

    TypeTextRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
          description: |
            The text, at most 1000 characters (UTF-16 code units). Its estimated typing time must be at most 60
            seconds.
        intervalMs:
          type: integer
          minimum: 0
          maximum: 1000
          default: 20
          description: The pause after each typed character.

    # ---- WebSocket messages (GET /v1/stream) ---------------------------------------------------------------
    TextSpace:
      type: string
      enum: [screen, pixel]
      default: screen
      description: The space of `region`, `offset` and the boxes of the answer (not case sensitive). `device` is not accepted.

    TextRegion:
      type: object
      description: |
        Only this part of the screen is read (lines whose centre is inside it). In `screen` space within 0..1, in `pixel`
        space within the `ref` size; the width and height are above 0.
      required: [x, y, width, height]
      additionalProperties: false
      properties:
        x:
          type: number
          minimum: 0
        y:
          type: number
          minimum: 0
        width:
          type: number
          exclusiveMinimum: 0
        height:
          type: number
          exclusiveMinimum: 0

    TextLang:
      type: string
      minLength: 1
      maxLength: 35
      pattern: "^[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?$"
      description: |
        A BCP 47 language tag such as `ja` or `en-US`. Without it, the first of the Windows user's languages that has OCR.
        A language whose OCR is not installed is `409` `ocr_unavailable`.

    TextEngineId:
      type: string
      minLength: 1
      maxLength: 32
      pattern: "^[a-z0-9-]+$"
      description: The engine to use (`windows`, the only one; the default). An unknown one is `409` `ocr_unavailable`.

    TextReadRequest:
      type: object
      additionalProperties: false
      allOf:
        - $ref: "#/components/schemas/PixelNeedsRef"
      properties:
        lang:
          $ref: "#/components/schemas/TextLang"
        engine:
          $ref: "#/components/schemas/TextEngineId"
        space:
          $ref: "#/components/schemas/TextSpace"
        ref:
          $ref: "#/components/schemas/PixelRef"
        region:
          $ref: "#/components/schemas/TextRegion"
        words:
          type: boolean
          default: false
          description: Add the words of every line.

    TextFindRequest:
      type: object
      required: [text]
      additionalProperties: false
      allOf:
        - $ref: "#/components/schemas/PixelNeedsRef"
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 200
          description: The text to find. Only white space is `400`.
        match:
          type: string
          enum: [exact, contains]
          default: exact
          description: "`exact`: the whole line (an isolated character at either end may be left out). `contains`: part of a line."
        loose:
          type: boolean
          default: false
          description: Treat look-alike characters, voiced marks and the kinds of kana as the same.
        caseSensitive:
          type: boolean
          default: false
        timeoutMs:
          type: integer
          minimum: 0
          maximum: 30000
          default: 0
          description: How long to wait for the text (0 reads once).
        pollMs:
          type: integer
          minimum: 300
          maximum: 5000
          default: 500
          description: The pause between readings while waiting (from the end of one reading).
        lang:
          $ref: "#/components/schemas/TextLang"
        engine:
          $ref: "#/components/schemas/TextEngineId"
        space:
          $ref: "#/components/schemas/TextSpace"
        ref:
          $ref: "#/components/schemas/PixelRef"
        region:
          $ref: "#/components/schemas/TextRegion"

    TapTextRequest:
      type: object
      required: [text]
      additionalProperties: false
      allOf:
        - $ref: "#/components/schemas/PixelNeedsRef"
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 200
          description: The text to find. Only white space is `400`.
        match:
          type: string
          enum: [exact, contains]
          default: exact
        loose:
          type: boolean
          default: false
        caseSensitive:
          type: boolean
          default: false
        timeoutMs:
          type: integer
          minimum: 0
          maximum: 30000
          default: 0
        pollMs:
          type: integer
          minimum: 300
          maximum: 5000
          default: 500
        select:
          type: string
          enum: [unique, first, index]
          default: unique
          description: "When there are several matches: `unique` refuses (`ambiguous_text`), `first` taps the first in reading order, `index` the `index`-th."
        index:
          type: integer
          minimum: 0
          description: "Only with `select: index` (required there)."
        offset:
          $ref: "#/components/schemas/Point"
          description: "Tap this far from the centre of the match: `screen` -1..1, `pixel` within the `ref` size. Default (0, 0)."
        settleMs:
          type: integer
          minimum: 0
          maximum: 2000
          default: 250
          description: The pause before the reading that confirms the match. 0 taps without confirming.
        holdMs:
          type: integer
          minimum: 0
          default: 80
          description: As in `POST /v1/touch/tap`.
        count:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
        intervalMs:
          type: integer
          minimum: 0
          default: 120
        lang:
          $ref: "#/components/schemas/TextLang"
        engine:
          $ref: "#/components/schemas/TextEngineId"
        space:
          $ref: "#/components/schemas/TextSpace"
        ref:
          $ref: "#/components/schemas/PixelRef"
        region:
          $ref: "#/components/schemas/TextRegion"

    StreamContact:
      type: object
      description: One finger of a `down` or `move` message.
      required: [id, x, y]
      additionalProperties: false
      properties:
        id:
          type: integer
          enum: [0, 1]
          description: The contact id (the digitizer has two points).
        x:
          type: number
          description: Horizontal position in the space of the last `down`.
        y:
          type: number
          description: Vertical position in the space of the last `down`.

    StreamClientMessage:
      description: |
        A message from the client to `GET /v1/stream`, a JSON object in a text frame. `op` selects the kind; see
        the description of `GET /v1/stream` for the members each kind takes. Messages that are not valid are
        answered with an `error` event.
      oneOf:
        - type: object
          title: auth
          description: The first message, within 2 seconds of the upgrade.
          required: [op, token]
          additionalProperties: false
          properties:
            op:
              const: auth
            token:
              type: string
        - type: object
          title: down
          required: [op, seq, contacts]
          additionalProperties: false
          allOf:
            - $ref: "#/components/schemas/PixelNeedsRef"
          properties:
            op:
              const: down
            seq:
              $ref: "#/components/schemas/StreamSeq"
            space:
              $ref: "#/components/schemas/Space"
            ref:
              $ref: "#/components/schemas/PixelRef"
            contacts:
              $ref: "#/components/schemas/StreamContacts"
        - type: object
          title: move
          required: [op, seq, contacts]
          additionalProperties: false
          properties:
            op:
              const: move
            seq:
              $ref: "#/components/schemas/StreamSeq"
            contacts:
              $ref: "#/components/schemas/StreamContacts"
        - type: object
          title: up
          required: [op, seq]
          additionalProperties: false
          properties:
            op:
              const: up
            seq:
              $ref: "#/components/schemas/StreamSeq"
        - type: object
          title: key
          required: [op, seq, key, down]
          additionalProperties: false
          properties:
            op:
              const: key
            seq:
              $ref: "#/components/schemas/StreamSeq"
            key:
              type: string
              description: A key name, see `POST /v1/keys/press`.
            modifiers:
              type: array
              items:
                type: string
                enum: [cmd, shift, option, ctrl]
            down:
              type: boolean
              description: True to press, false to release.
        - type: object
          title: ping
          required: [op]
          additionalProperties: false
          properties:
            op:
              const: ping

    StreamSeq:
      type: integer
      minimum: 0
      description: A number chosen by the client; the `ack` or `error` for the message repeats it.

    StreamContacts:
      type: array
      minItems: 1
      maxItems: 2
      description: One or two fingers; the ids must be unique.
      items:
        $ref: "#/components/schemas/StreamContact"

    StreamEvent:
      description: A message from the server on `GET /v1/stream`, a JSON object in a text frame. `ev` selects the kind.
      oneOf:
        - type: object
          title: ready
          required: [ev, api]
          properties:
            ev:
              const: ready
            api:
              type: integer
              description: The API version (1).
        - type: object
          title: ack
          required: [ev, seq]
          properties:
            ev:
              const: ack
            seq:
              type: integer
        - type: object
          title: error
          description: The message was refused and did nothing.
          required: [ev, code, detail]
          properties:
            ev:
              const: error
            seq:
              type: integer
              description: The `seq` of the refused message, when it had a valid one.
            code:
              $ref: "#/components/schemas/Problem/properties/code"
            detail:
              type: string
            reason:
              type: string
              const: trial_limit
              description: "`purchase_required` only: the trial quota is used up, or the trial's time of the stream is over."
            limit:
              type: integer
              minimum: 0
              description: "With `reason`: the operations of the trial, or the seconds a stream may stay open."
            counter:
              type: string
              enum: [operations, stream_seconds]
              description: "With `reason`: `operations` (the stream could not be opened) or `stream_seconds` (the stream was open for the trial's time)."
        - type: object
          title: interrupted
          required: [ev, reason]
          properties:
            ev:
              const: interrupted
            reason:
              type: string
              enum: [user, cancelled, session_ended, idle]
              description: |
                `user`, `cancelled` and `session_ended` end the stream (everything was lifted and released). `idle`
                (the dead-man) lifted and released everything but the stream stays open.
        - type: object
          title: pong
          required: [ev]
          properties:
            ev:
              const: pong
