<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- D (large sizes): mint phone-shaped scoop with chocolate-brown outlines, sitting a little askew on a waffle
       cone whose tip points to the lower left, melting over the rim; a mouse pointer comes in from outside. -->
  <defs>
    <clipPath id="cone"><path d="M-48 0 L48 0 L0 104 Z"/></clipPath>
  </defs>
  <g transform="translate(128 128) scale(0.9) translate(-37 38)">
    <!-- cone (local: rim on y = 0, tip at y = 104) -->
    <g transform="rotate(35)">
      <path d="M-48 0 L48 0 L0 104 Z" fill="#F2C27B"/>
      <g clip-path="url(#cone)" stroke="#C98E45" stroke-width="6">
        <path d="M-78 -20 L52 110 M-50 -20 L80 110 M-22 -20 L108 110 M-106 -20 L24 110"/>
        <path d="M78 -20 L-52 110 M50 -20 L-80 110 M22 -20 L-108 110 M106 -20 L-24 110"/>
      </g>
      <path d="M-48 0 L48 0 L0 104 Z" fill="none" stroke="#4E2C1A" stroke-width="9" stroke-linejoin="round"/>
    </g>
    <!-- phone-shaped scoop (local: bottom edge on y = 0), turned less than the cone and shifted right -->
    <g transform="rotate(27) translate(8 6)">
      <path d="M-34 -154 H34 a24 24 0 0 1 24 24 V-6 a10 10 0 0 1 -20 0 a9 9 0 0 0 -18 0 v14 a10 10 0 0 1 -20 0 v-6 a9 9 0 0 0 -18 0 a9 9 0 0 1 -18 0 v8 a11 11 0 0 1 -22 0 V-130 a24 24 0 0 1 24 -24 Z"
            fill="#86E0C6" stroke="#4E2C1A" stroke-width="9" stroke-linejoin="round"/>
      <rect x="-44" y="-138" width="88" height="114" rx="10" fill="#F4FFFB" stroke="#4E2C1A" stroke-width="4"/>
      <rect x="-12" y="-148" width="24" height="5" rx="2.5" fill="#4E2C1A"/>
      <rect x="-35" y="-128" width="18" height="18" rx="5" fill="#FFB3C9"/>
      <rect x="-9" y="-128" width="18" height="18" rx="5" fill="#FFD666"/>
      <rect x="17" y="-128" width="18" height="18" rx="5" fill="#8CCBFF"/>
      <rect x="-35" y="-102" width="18" height="18" rx="5" fill="#B6E9D9"/>
      <rect x="-9" y="-102" width="18" height="18" rx="5" fill="#C9B6FF"/>
      <rect x="17" y="-102" width="18" height="18" rx="5" fill="#FFB3C9"/>
      <rect x="-14" y="-34" width="28" height="4" rx="2" fill="#4E2C1A" opacity="0.6"/>
    </g>
    <!-- mouse pointer coming in from the lower right, tip on the screen, with click marks -->
    <g transform="translate(56 -62) rotate(-10) scale(1.35)">
      <g stroke="#1E9C78" stroke-width="4.5" stroke-linecap="round">
        <path d="M-8 -8 l-7 -7"/>
        <path d="M2 -11 v-10"/>
        <path d="M-11 2 h-10"/>
      </g>
      <path d="M0 0 V40 L10 31 L17 46 L25 42 L18 28 L31 28 Z" fill="#FFFFFF" stroke="#2A1A10" stroke-width="4.5" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
